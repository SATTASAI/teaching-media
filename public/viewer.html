<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สื่อทั้งหมด</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="viewer-body">
<div class="workspace">
<nav class="breadcrumb" aria-label="ตำแหน่งปัจจุบัน"><button class="crumb-home" id="crumbHome">แฟ้มสื่อของฉัน</button><span id="crumbPath"></span></nav>
<header class="v-toolbar">
  <div class="v-title"><span class="heading-icon" id="headingIcon"></span><h1 id="vTitle">สื่อทั้งหมด</h1><span class="muted" id="vCount"></span></div>
  <div class="v-tools"><button class="btn btn-primary" id="quickUpload"></button><button class="btn btn-plan" id="quickPlanUpload"></button><button class="btn" id="quickCreateFolder"></button><div id="folderContext" class="folder-context" hidden></div></div>
</header>
<div class="library-controls"><label class="library-search"><span id="librarySearchIcon"></span><input class="input" id="librarySearch" type="search" aria-label="ค้นหาชื่อสื่อ" placeholder="ค้นหาไฟล์ในแฟ้มนี้…"></label><div class="v-tools">
    <label class="type-filter"><select class="input" id="typeFilter" aria-label="กรองประเภทไฟล์"></select></label>
    <label class="v-sort"><span class="muted">จัดเรียง</span><select class="input" id="sortSel" aria-label="เรียงลำดับสื่อ"></select></label>
    <div class="seg" id="viewSeg"><button data-view="grid" title="แบบตาราง"></button><button data-view="list" title="แบบรายการ"></button></div>
    <button class="btn btn-sm" id="selectBtn"></button>
    <button class="btn btn-sm btn-danger" id="emptyTrashBtn" hidden></button>
  </div>
</div>
<div class="inline-drop" id="inlineDrop" role="button" tabindex="0" aria-label="เลือกหรือลากไฟล์เพื่ออัปโหลด"><span id="inlineDropIcon"></span><div><b>ลากและวางไฟล์ที่นี่ เพื่ออัปโหลด</b><small>รองรับเอกสาร รูปภาพ วิดีโอ และเสียง · จัดหมวดให้อัตโนมัติ</small></div></div>
<div class="v-bulk" id="bulkBar" hidden>
  <b id="bulkCount">เลือก 0 รายการ</b>
  <button class="btn btn-sm" id="bulkAll">เลือกทั้งหมด</button>
  <span class="v-bulk-actions" id="bulkActions"></span>
  <button class="btn btn-sm" id="bulkCancel">ยกเลิก</button>
</div>
<section id="folderGrid" class="folder-grid" aria-label="แฟ้มงาน"></section>
<main id="vMain" class="v-main" aria-live="polite"></main>
</div>

<aside class="pv" id="pv" aria-label="ตัวอย่างและรายละเอียดสื่อ" hidden>
  <div class="pv-head">
    <button class="btn btn-icon" id="pvBack" title="ปิดตัวอย่าง"></button>
    <div class="pv-title"><b id="pvTitle"></b><small class="muted" id="pvMeta"></small></div>

  </div>
  <div class="pv-body" id="pvBody"></div>
  <section class="pv-details"><h2>รายละเอียดไฟล์</h2><dl id="pvDetails"></dl><div class="pv-desc" id="pvDesc" hidden></div><div class="pv-actions" id="pvActions"></div></section>
</aside>

<div class="modal" id="editModal">
  <form class="dialog" id="editForm">
    <h2>แก้ไขสื่อ</h2>
    <label class="field"><span>ชื่อสื่อ</span><input class="input" name="title" maxlength="200" required></label>
    <label class="field" id="editUrlField"><span>ลิงก์ (URL)</span><input class="input" name="url" type="url"></label>
    <label class="field"><span>หมวด</span><select class="input" name="category" id="editCat"></select></label>
    <label class="field"><span>คำอธิบาย</span><textarea class="input" name="description" rows="3" maxlength="2000"></textarea></label>
    <div class="dialog-actions"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn btn-primary">บันทึก</button></div>
  </form>
</div>

<script src="/common.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
